<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e563b" />
    <meta name="apple-mobile-web-app-title" content="Gusto" />
    <meta name="application-name" content="Gusto" />

    <!-- Adaptive favicons. Light OS theme → black logo. Dark OS theme → white logo. -->
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icons/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icons/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Fallback (always last) for browsers that don't honor the media attribute on rel=icon -->
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icons/favicon-fallback.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/logo-head.png" />

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="min-h-screen bg-gusto-green text-gusto-cream antialiased"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
