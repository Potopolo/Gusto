<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172B1E" />
    <meta name="apple-mobile-web-app-title" content="Gusto" />
    <meta name="application-name" content="Gusto" />

    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icons/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/icons/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icons/favicon-fallback.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/logo-head.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="min-h-screen bg-gradient-to-b from-gusto-green-900 to-gusto-green font-sans text-gusto-cream antialiased"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
